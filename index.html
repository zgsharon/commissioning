<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Commissioning"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Commissioning Survey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Phone-first field tool: one column, sticky phase bar, bottom action bar. Same tokens as the other ICG field apps. */
  :root {
    --bg: #F4F3EF; --surface: #FFFFFF; --surface-2: #ECEAE4; --ink: #1B1F24; --muted: #5F6772;
    --line: #D6D3CB; --accent: #2E5C8A; --accent-ink: #FFFFFF; --accent-soft: #E3ECF5;
    --good: #2A7A4B; --good-soft: #DFF1E6; --warn: #A8551C; --warn-soft: #F8E7DA; --bad: #B3261E; --bad-soft: #F9DEDC; --focus: #7FB0E0;
    --unmit: #7A5A12; --unmit-soft: #F5ECD6; --mit: #2E5C8A; --mit-soft: #E3ECF5;
    --shadow: 0 1px 2px rgba(20,24,30,.06), 0 6px 20px rgba(20,24,30,.06);
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181C; --surface: #1E2227; --surface-2: #272C33; --ink: #E8E6E1; --muted: #A2A9B3;
      --line: #363C45; --accent: #7FB0E0; --accent-ink: #0F1A26; --accent-soft: #23364A;
      --good: #7ACB99; --good-soft: #1F3A2B; --warn: #E9A56E; --warn-soft: #40291A; --bad: #F2A39C; --bad-soft: #4A1F1C; --focus: #A9CBEC;
      --unmit: #E2C27A; --unmit-soft: #3A2F17; --mit: #7FB0E0; --mit-soft: #23364A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181C; --surface: #1E2227; --surface-2: #272C33; --ink: #E8E6E1; --muted: #A2A9B3;
    --line: #363C45; --accent: #7FB0E0; --accent-ink: #0F1A26; --accent-soft: #23364A;
    --good: #7ACB99; --good-soft: #1F3A2B; --warn: #E9A56E; --warn-soft: #40291A; --bad: #F2A39C; --bad-soft: #4A1F1C; --focus: #A9CBEC;
    --unmit: #E2C27A; --unmit-soft: #3A2F17; --mit: #7FB0E0; --mit-soft: #23364A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); margin: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding-block: 8px 130px; padding-inline: 16px; }
  .mono, .num input, .val { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-block: 10px 6px; }
  .top > div { min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-block: 12px; }
  .card > h2, .h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; }
  .card.unmit { border-color: var(--unmit); }
  .card.mit { border-color: var(--mit); }
  .card.unmit > h2 { color: var(--unmit); }
  .card.mit > h2 { color: var(--mit); }
  .lbl { display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; min-height: 46px; -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  input:focus, textarea:focus, select:focus, button:focus-visible, label.add:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 10px; }
  .f { min-width: 0; }
  .f .lbl { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .f .lbl b { color: var(--ink); font-weight: 600; }
  .num { display: flex; align-items: stretch; }
  .num input { border-radius: 0 10px 10px 0; min-width: 0; }
  .num .unit { align-self: center; padding-left: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .num.nosign input { border-radius: 10px; }
  .sgn { flex: 0 0 40px; font: 600 18px/1 var(--mono); border: 1px solid var(--line); border-right: 0; border-radius: 10px 0 0 10px; background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .sgn.pos { color: var(--warn); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1 1 auto; min-height: 42px; font: inherit; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg button[data-tone="good"][aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--bg); }
  .seg button[data-tone="warn"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--bg); }
  .seg.small button { min-height: 34px; font-size: 13px; padding: 3px 10px; flex: 0 1 auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { min-height: 38px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .btn { font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.small { min-height: 34px; font-size: 13px; padding: 4px 10px; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  label.btn input[type=file] { display: none; }
  /* sticky phase bar */
  .phasebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); }
  .phasebar .seg button { min-height: 44px; font-weight: 600; }
  .phasebar .seg button[data-ph="unmit"][aria-pressed="true"] { background: var(--unmit); border-color: var(--unmit); color: var(--bg); }
  .phasebar .seg button[data-ph="mit"][aria-pressed="true"] { background: var(--mit); border-color: var(--mit); color: var(--bg); }
  .phasebar .hint { margin-top: 6px; }
  .pbrow { display: flex; gap: 8px; align-items: stretch; }
  .pbrow .seg { flex: 1; min-width: 0; }
  .pback { flex: 0 0 auto; min-height: 44px; padding: 6px 10px; font-weight: 600; color: var(--accent); }
  @media (max-width: 360px) { .phasebar .seg button { font-size: 13px; padding: 6px 6px; } }
  /* point list */
  .plist { display: flex; flex-direction: column; gap: 8px; }
  .pt { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
  .pt .id { font-weight: 600; font-size: 16px; }
  .pt .ty { color: var(--muted); font-size: 13px; }
  .pt .vals { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .pt .vals .val { color: var(--ink); font-size: 13px; }
  .pt .right { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.u { background: var(--unmit-soft); color: var(--unmit); }
  .pill.m { background: var(--mit-soft); color: var(--mit); }
  .pill.off { background: var(--surface-2); color: var(--muted); }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .summary div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .summary b { display: block; font: 600 20px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .summary span { font-size: 12px; color: var(--muted); }
  /* point detail */
  .design { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .design dt { color: var(--muted); }
  .design dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .warns { display: flex; flex-direction: column; gap: 6px; }
  .w { padding: 8px 10px; border-radius: 10px; font-size: 14px; }
  .w.bad { background: var(--bad-soft); color: var(--bad); font-weight: 500; }
  .w.warn { background: var(--warn-soft); color: var(--warn); }
  .w.info { background: var(--surface-2); color: var(--muted); }
  .legs { display: flex; flex-direction: column; gap: 10px; }
  .leg { padding: 10px; border-radius: 10px; background: var(--surface-2); }
  .leg .head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .leg .head input { min-height: 38px; padding: 6px 10px; }
  .leg .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .leg .sgn { flex-basis: 32px; }
  .leg input, .leg .sgn { background: var(--surface); }
  .leg .sgn { background: var(--bg); }
  .chk { display: flex; flex-direction: column; gap: 8px; }
  .chk .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .chk .row span { flex: 1 1 180px; font-size: 15px; }
  .slot { padding-block: 8px; border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; padding-top: 0; }
  .slot .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .slot .sh .nm { font-weight: 500; }
  .slot .sh .nm .pill { margin-left: 6px; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .thumb img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; max-width: 100%; }
  .thumb button { position: absolute; top: 4px; right: 4px; min-height: 28px; font: inherit; font-size: 12px; border-radius: 8px; border: 0; background: rgba(0,0,0,.6); color: #fff; padding: 2px 8px; cursor: pointer; }
  .thumb .tall { position: absolute; left: 4px; bottom: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--warn); color: var(--bg); }
  .thumb .cap { font-size: 11px; padding: 3px 6px; color: var(--muted); overflow-wrap: anywhere; }
  label.add { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 4px 12px; border: 1px dashed var(--accent); border-radius: 10px; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  label.add input { display: none; }
  .gpsrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .gpsrow .val { font-size: 14px; }
  .xrow { display: grid; grid-template-columns: 1.4fr 1fr .6fr auto; gap: 6px; align-items: center; margin-top: 6px; }
  .xrow input { min-height: 40px; padding: 6px 8px; font-size: 15px; }
  .xrow button { min-height: 40px; min-width: 40px; font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
  .nav2 { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
  details > summary { cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; font-size: 18px; }
  details[open] > summary::after { content: "\2013"; }
  details[open] > summary { margin-bottom: 10px; }
  .unmit details > summary, details.unmit > summary { color: var(--unmit); }
  .mit details > summary, details.mit > summary { color: var(--mit); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow); z-index: 4; }
  .bar .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .bar .status { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); z-index: 9; }
  .confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 12px; padding: 12px; margin-block: 12px; }
  .confirm p { margin: 0 0 10px; color: var(--ink); }
  .demo { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .dwg { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .dwg-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .dwg-bar select { width: auto; min-width: 0; flex: 1 1 140px; min-height: 36px; padding: 4px 28px 4px 8px; font-size: 14px; }
  .dwg-name { flex: 1 1 140px; min-width: 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dwg-ctl { display: flex; gap: 6px; align-items: center; }
  .dwg-ctl .mono { font-size: 13px; min-width: 44px; text-align: center; }
  .dwg-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; background: #fff; }
  .dwg-scroll canvas { display: block; max-width: none; }
  .back { font: inherit; font-size: 15px; color: var(--accent); background: none; border: 0; padding: 8px 0; cursor: pointer; font-weight: 500; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } .summary b { font-size: 17px; } }
  @media (prefers-reduced-motion: no-preference) { .seg button, .chips button, .btn, .pt { transition: background-color .12s ease, border-color .12s ease; } }
</style>

<div id="app" class="wrap"></div>
<div id="bar" class="bar" hidden><div class="inner"><div class="status" id="barStatus"></div><button class="btn" id="btnJson" type="button">Readings only</button><button class="btn primary" id="btnZip" type="button">Save package</button></div></div>
<div id="toast" class="toast" hidden></div>

  save(true); view.keepScroll = true; view.settingsOpen = true; render(); toast('Drawings saved on this phone.');
}

// ---------- GPS ----------
function captureGps() {
  if (!navigator.geolocation) { toast('This browser has no GPS access.'); return; }
  toast('Getting GPS...', 20000);
  navigator.geolocation.getCurrentPosition(pos => {
    const p = ps(view.id); p.gps = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, t: nowIso() };
    touch(view.id); save(); toast('GPS saved, ±' + Math.round(pos.coords.accuracy * 3.281) + ' ft'); view.keepScroll = true; render();
  }, err => toast('GPS failed: ' + err.message + '. Open the app from the home screen link, not inside claude.ai, and allow location.', 7000), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}
function startWatch() {
  if (watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(pos => { const first = !here; here = { lat: pos.coords.latitude, lon: pos.coords.longitude }; if (view.name === 'job' && (first || Math.random() < 0.2)) { view.keepScroll = true; render(); } }, () => { toast('Location is not available, so the list stays in drawing order.'); st.sort = 'drawing'; stopWatch(); if (view.name === 'job') { view.keepScroll = true; render(); } }, { enableHighAccuracy: true, maximumAge: 15000 });
}
function stopWatch() { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; }

// ---------- job files, restore ----------
function loadJobDef(j) {
  if (!j || j.kind !== 'icg-commissioning-job' || !Array.isArray(j.points)) throw new Error('That is not a commissioning job file.');
  const existed = !!store('icgc:job:' + j.id);
  job = j; saveJobDef();
  st = store('icgc:st:' + j.id) || newState(); save(true);
  view = { name: 'job' }; render();
  toast(existed ? 'Job file updated. Your readings were kept.' : j.line + ' loaded with ' + j.points.length + ' test points.');
}
async function readRestore(file) {
  let data, photos = [];
  if (/\.zip$/i.test(file.name) || file.type === 'application/zip') {
    const zip = await JSZip.loadAsync(file);
    const f = zip.file('data.json'); if (!f) throw new Error('No data.json inside that zip.');
    data = JSON.parse(await f.async('string'));
    for (const ph of (data.photos || [])) { const zf = zip.file(ph.file); if (zf) photos.push(Object.assign({}, ph, { bytes: await zf.async('arraybuffer') })); }
  } else data = JSON.parse(await file.text());
  if (!data || data.kind !== 'icg-commissioning-package') throw new Error('That is not a saved package from this app.');
  const exists = !!store('icgc:job:' + data.job.id);
  if (exists) { pending = { kind: 'restore', data, photos, msg: 'This phone already has ' + data.job.line + '. Replace its readings with the ones in this file (saved ' + new Date(data.exportedAt).toLocaleString() + ')?' + (photos.length ? ' ' + photos.length + ' photos will be added.' : ''), yes: 'Replace' }; view.keepScroll = true; render(); }
  else await applyRestore(data, photos);
}
async function applyRestore(data, photos) {
  job = data.job; saveJobDef(); st = data.state; st.savedPhotos = st.savedPhotos || {}; photos.forEach(p => { st.savedPhotos[p.key] = 1; }); save(true);
  const have = new Set((await jobPhotos(job.id, false)).map(r => r.key));
  let n = 0;
  for (const ph of photos) { if (have.has(ph.key)) continue; await putPhoto({ key: ph.key, job: job.id, point: ph.point, slot: ph.slot, caption: ph.caption || '', t: ph.t, gps: ph.gps || null, bytes: ph.bytes }); n++; }
  view = { name: 'job' }; render(); toast('Restored ' + job.line + (n ? ' with ' + n + ' photos' : ''));
}

// ---------- export ----------
function initials() { return (st.tech[0] || 'ICG').split(',')[0].split(/\s+/).map(w => w[0] || '').join('').toUpperCase(); }
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function readingsCsv() {
  const pts = allPoints(); const maxLegs = Math.max(1, ...pts.map(d => (ps(d.id).legs || []).length));
  const cols = ['No', 'Test Station ID', 'Type', 'Mitigation #', 'Design Latitude', 'Design Longitude', 'Field Latitude', 'Field Longitude', 'GPS Offset (ft)', 'Status',
    'Unmit DC ON (V)', 'Unmit DC OFF (V)', 'Unmit AC (V)', 'Unmit Coupon AC (V)', 'Unmit Coupon AC Current (uA)', 'Unmit Coupon AC Density (A/m2)', 'Unmit Coupon DC (V)', 'Unmit Coupon Disconnected DC (V)', 'Unmit Coupon DC Current (uA)',
    'Mit DC ON (V)', 'Mit DC OFF (V)', 'Mit AC (V)', 'SSD AC Current (A)', 'Mit Coupon AC (V)', 'Mit Coupon AC Current (uA)', 'Mit Coupon AC Density (A/m2)', 'Mit Coupon DC (V)', 'Mit Coupon Disconnected DC (V)', 'Mit Coupon DC Current (uA)',
    'Stationary-to-Portable Ref (V)'];
  for (let i = 1; i <= maxLegs; i++) cols.push('Lead ' + i + ' Label', 'Lead ' + i + ' Length (ft)', 'Lead ' + i + ' Potential (V)', 'Lead ' + i + ' Resistance 1 (ohm)', 'Lead ' + i + ' Resistance 2 (ohm)');
  cols.push('Rectifier V', 'Rectifier A', 'Tap', 'Iso Side A DC', 'Iso Side B DC', 'Iso Side A AC', 'Iso Side B AC', 'Iso Result', 'Logger AM', 'MasterLink AL', 'ER1', 'ER1 Dir', 'ER2', 'ER2 Dir', 'MetriCorr Status Light', 'MetriCorr Powered Up', 'MetriCorr Notes', 'Other Readings', 'Checklist No', 'Checks', 'Inspection Remarks', 'Photos', 'Unmit By', 'Mit By', 'Drawing Type', 'Label in Field', 'Matches Drawings', 'Differences', 'SSD As Found', 'SSD Left', 'Test Leads', 'Type Readings');
  const rows = [cols];
  pts.forEach((d, n) => {
    const p = ps(d.id), T = TYPES[d.type] || { checks: [] }, off = distFt(d.lat, d.lon, p.gps && p.gps.lat, p.gps && p.gps.lon);
    const ju = density(p.u.c_iac), jm = density(p.m.c_iac);
    const r = [n + 1, d.id, (TYPES[d.type] || {}).name || d.type, d.mit || '', d.lat ?? '', d.lon ?? '', p.gps ? p.gps.lat.toFixed(6) : '', p.gps ? p.gps.lon.toFixed(6) : '', off == null ? '' : Math.round(off), (STATUS.find(s => s[0] === p.status) || [])[1],
      p.u.dc_on, p.u.dc_off, p.u.ac, p.u.c_ac, p.u.c_iac, ju == null ? '' : ju.toFixed(2), p.u.c_dc, p.u.c_disc, p.u.c_idc,
      p.m.dc_on, p.m.dc_off, p.m.ac, p.m.ssd_a, p.m.c_ac, p.m.c_iac, jm == null ? '' : jm.toFixed(2), p.m.c_dc, p.m.c_disc, p.m.c_idc, p.x.ref];
    for (let i = 0; i < maxLegs; i++) { const l = (p.legs || [])[i] || {}; r.push(l.label, l.len, l.pot, l.r1, l.r2); }
    const ex = ['u', 'm', 'x'].flatMap(k => (p.extra[k] || []).filter(x => x.what || x.val).map(x => (k === 'u' ? 'Unmit ' : k === 'm' ? 'Mit ' : '') + x.what + ' ' + x.val + ' ' + (x.unit || ''))).join('; ');
    r.push(p.x.rect_v, p.x.rect_a, p.x.rect_tap, p.x.iso_a, p.x.iso_b, p.x.iso_aac, p.x.iso_bac, p.x.iso_res, p.er.am, p.er.al, p.er.er1, p.er.er1d, p.er.er2, p.er.er2d, p.er.led || p.er.comm || '', p.er.pwr || '', p.er.note, ex,
      (T.checks || []).filter((c, i) => p.chk[i] === 'n').join('; '), checks(d).filter(w => w.lvl !== 'info').map(w => w.msg).join(' '), p.rem, p.photos || 0, p.by.u ? p.by.u.tech + ' ' + p.by.u.t : '', p.by.m ? p.by.m.tech + ' ' + p.by.m.t : '',
      d.drawingType && d.drawingType !== d.type ? ((TYPES[d.drawingType] || {}).name || d.drawingType) : '', d.tag || '', p.match || '', p.diff || '', p.ssdFound || '', p.ssdLeft || '',
      (p.leads || []).map(l => [l.color, l.size, l.to ? 'to ' + l.to : '', l.cond && l.cond !== 'ok' ? '(' + l.cond + ')' : ''].filter(Boolean).join(' ')).join('; '),
      typeReadings(p));
    rows.push(r);
  });
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
const TYPE_KEYS = ['f_dc_on', 'f_dc_off', 'f_ac', 'cs_dc', 'cs_ac', 'f_owner', 'bond_i', 'bond_r', 'an_oc', 'an_i', 'an_disc', 'bond'];
function typeReadings(p) {
  const out = [];
  ['u', 'm', 'x'].forEach(k => TYPE_KEYS.forEach(f => { const v = p[k] && p[k][f]; if (v != null && v !== '') out.push((k === 'u' ? 'Unmit ' : k === 'm' ? 'Mit ' : '') + (F[f] ? F[f].l : 'Bond') + ' ' + v + (F[f] && F[f].u ? ' ' + F[f].u : '')); }));
  return out.join('; ');
}
function kml() {
  const pm = allPoints().map(d => { const p = ps(d.id); const la = p.gps ? p.gps.lat : d.lat, lo = p.gps ? p.gps.lon : d.lon; if (la == null) return ''; return '<Placemark><name>' + esc(d.id) + '</name><description>' + esc(((TYPES[d.type] || {}).name || '') + (d.mit ? ', ' + d.mit : '') + (p.gps ? ', field GPS' : ', design GPS (not captured)') + (p.rem ? '. ' + p.rem : '')) + '</description><Point><coordinates>' + lo + ',' + la + ',0</coordinates></Point></Placemark>'; }).join('');
  return '<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + esc(job.line + ' as-found') + '</name>' + pm + '</Document></kml>';
}
async function buildPackage(withPhotos, all) {
  const saved = st.savedPhotos || {};
  const recs = (await jobPhotos(job.id, withPhotos)).filter(r => all || !saved[r.key]);
  const used = {}; const photos = [];
  recs.sort((a, b) => a.point === b.point ? (a.t < b.t ? -1 : 1) : (a.point < b.point ? -1 : 1)).forEach(r => {
    let base = slug(r.point) + ' ' + slug(r.slot); used[base] = (used[base] || 0) + 1; if (used[base] > 1) base += ' ' + used[base];
    photos.push({ key: r.key, file: 'photos/' + slug(r.point) + '/' + base + '.jpg', point: r.point, slot: r.slot, caption: r.caption || '', t: r.t, gps: r.gps || null, bytes: r.bytes });
  });
  const data = { kind: 'icg-commissioning-package', v: 1, app: APP_VERSION, exportedAt: nowIso(), tech: st.tech.slice(), job, state: st, photos: photos.map(p => Object.assign({}, p, { bytes: undefined })) };
  return { data, photos };
}
async function share(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); return 'shared'; } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return 'download';
}
$('#btnZip').addEventListener('click', async () => {
  const btn = $('#btnZip'); btn.disabled = true; btn.textContent = 'Building...';
  await savePackage(false);
  btn.disabled = false; btn.textContent = 'Save package';
});
async function savePackage(all) {
  try {
    save(true);
    const { data, photos } = await buildPackage(true, all);
    const zip = new JSZip();
    zip.file('data.json', JSON.stringify(data, null, 1));
    zip.file(slug(job.line) + ' readings.csv', readingsCsv());
    zip.file(slug(job.line) + ' as-found.kml', kml());
    photos.forEach(p => zip.file(p.file, p.bytes, { binary: true }));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const d = new Date(), hhmm = String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '-' + String(d.getSeconds()).padStart(2, '0');
    const name = slug(job.line) + ' commissioning ' + today() + ' ' + hhmm + ' ' + initials() + (all ? ' all photos' : '') + '.zip';
    const file = new File([blob], name, { type: 'application/zip' });
    const r = await share(file);
    if (r === 'shared' || r === 'download') {
      st.savedPhotos = st.savedPhotos || {}; photos.forEach(p => { st.savedPhotos[p.key] = 1; }); save(true); refreshUnsaved();
      const what = photos.length ? 'Readings and ' + photos.length + ' photo' + (photos.length > 1 ? 's' : '') : 'Readings (no new photos)';
      toast(r === 'shared' ? what + ' saved. ' + (blob.size / 1048576).toFixed(1) + ' MB.' : 'Downloaded ' + name + '. Save it to OneDrive.', 5000);
    }
  } catch (e) { toast('Package failed: ' + (e && e.message ? e.message : e), 7000); }
}
$('#btnJson').addEventListener('click', async () => {
  try {
    save(true);
    const { data } = await buildPackage(false);
    const name = slug(job.line) + ' readings ' + today() + ' ' + initials() + '.json';
    const r = await share(new File([JSON.stringify(data, null, 1)], name, { type: 'application/json' }));
    if (r !== 'cancel') toast('Readings file ready: ' + name + '. No photos in this one.', 4000);
  } catch (e) { toast('Could not make the readings file: ' + (e && e.message ? e.message : e), 6000); }
});
